name: Bug report
description: Report a reproducible Quantumy defect.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, tokens, private keys, or customer data."
  - type: input
    id: version
    attributes:
      label: Version or commit SHA
      placeholder: "40-character commit SHA"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Sanitized reproduction steps
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and CI evidence
      description: Include Node version and workflow links. Remove private values.
    validations:
      required: false
